<title>Icarus Console</title>
<style>
  :root {
    --void: #0b0a08;
    --surface: #171310;
    --surface-raised: #1f1a15;
    --hairline: #2e271e;
    --hairline-soft: #221c16;
    --text: #f3ede3;
    --text-muted: #9c917e;
    --text-faint: #665e4f;

    --icarus: #e9a23b;
    --icarus-dim: #a8752c;
    --councilor: #7c8ce8;
    --councilor-dim: #5a63a8;
    --triage: #3fae8a;
    --triage-dim: #2c7d63;
    --system: #6b6252;

    --success: #5fbf77;
    --warning: #c97b3d;
    --critical: #e5484d;

    --serif: "Source Serif 4", Charter, "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: "Berkeley Mono", "JetBrains Mono", "IBM Plex Mono", "Cascadia Code", ui-monospace, "SF Mono", Consolas, monospace;

    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--void);
    color: var(--text);
    margin: 0;
    min-height: 100%;
  }

  body {
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--icarus); color: var(--void); }
  a { color: inherit; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: 0 28px 80px; }

  header.masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 26px 0 20px;
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
  }

  .wordmark { display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); }
  /* A drawn shape, not a font glyph — 🜂 (alchemical fire) is a rare
     codepoint with spotty font support, so its shape/centering was really
     down to whatever fallback font the browser found. This is exact and
     rotates around a true center by construction. Sized in em so it scales
     naturally with whatever text context it sits in (wordmark, an h1
     loading state, a mono label) without a separate rule per usage. */
  .tri {
    display: inline-block;
    width: 0.85em; height: 0.85em;
    color: var(--icarus);
    vertical-align: middle;
    overflow: visible;
  }
  .wordmark .glyph { font-size: 18px; }

  /* The same glyph as the wordmark, repurposed as a loading indicator —
     a slow burn rather than a generic spinner. */
  .loader {
    animation: loaderSpin 1.6s linear infinite;
    /* Computed, not eyeballed: the polygon's vertices are (12,4), (21,19),
       (3,19) in the 24x24 viewBox below — centroid = average of the three
       points = (12, 14), i.e. 50% / 58.33% of the viewBox. transform-box:
       view-box makes that percentage resolve against the viewBox itself
       rather than the element's rendered/stroked bounding box, which is
       what let the origin drift before. */
    transform-box: view-box;
    transform-origin: 50% 58.33%;
  }
  @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
  @keyframes loaderSpin { to { transform: rotate(360deg); } }
  .wordmark .name { font-size: 15px; font-weight: 600; letter-spacing: 0.2em; }
  .wordmark .host { font-size: 12px; color: var(--text-faint); letter-spacing: 0.08em; }

  .masthead-right {
    display: flex; align-items: center; gap: 18px;
    font-family: var(--mono); font-size: 12px; color: var(--text-muted);
  }

  .clock { font-variant-numeric: tabular-nums; color: var(--text-muted); }

  .readiness-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border: 1px solid var(--hairline); border-radius: 999px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  }

  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot.success { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .dot.warning { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
  .dot.critical { background: var(--critical); box-shadow: 0 0 8px var(--critical); }
  .dot.neutral { background: var(--text-faint); }

  nav.tabs { display: flex; gap: 4px; padding: 16px 0 0; }

  nav.tabs button {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    background: none; border: 1px solid transparent; color: var(--text-faint);
    padding: 9px 16px; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0;
  }
  nav.tabs button:hover { color: var(--text-muted); }
  nav.tabs button.active {
    color: var(--text); border-color: var(--hairline); border-bottom-color: var(--void); background: var(--surface);
  }

  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--icarus); outline-offset: 2px;
  }

  main.view { display: none; padding-top: 34px; }
  main.view.active { display: block; }

  /* ── TODAY ─────────────────────────────────────────────────────── */

  .today-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 48px; }

  .dispatch h1 {
    font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.25;
    text-wrap: balance; margin: 0 0 18px;
  }

  .dispatch .lede {
    font-size: 18px; line-height: 1.7; color: var(--text); max-width: 62ch; margin: 0 0 8px;
  }
  .dispatch .lede .hl { color: var(--icarus); font-style: italic; }

  .byline {
    font-family: var(--mono); font-size: 11px; color: var(--text-faint);
    letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 40px;
  }

  section.block { margin-bottom: 40px; }
  section.block > .eyebrow { margin-bottom: 14px; }

  .empty-note {
    font-family: var(--mono); font-size: 12.5px; color: var(--text-faint);
    padding: 14px 16px; border: 1px dashed var(--hairline); border-radius: var(--radius);
    display: flex; align-items: center; gap: 8px;
  }

  .attn-list {
    display: flex; flex-direction: column; gap: 1px;
    background: var(--hairline-soft); border: 1px solid var(--hairline-soft);
    border-radius: var(--radius); overflow: hidden;
  }

  .attn-item {
    background: var(--surface); padding: 14px 16px;
    display: grid; grid-template-columns: 3px 1fr auto; gap: 14px; align-items: center;
  }

  .attn-item .stripe { align-self: stretch; border-radius: 2px; }
  .attn-item .stripe.bill { background: var(--warning); }
  .attn-item .stripe.job_application { background: var(--councilor); }
  .attn-item .stripe.default { background: var(--icarus); }

  .attn-item .body .title { font-family: var(--serif); font-size: 15.5px; margin: 0 0 3px; }
  .attn-item .body .meta {
    font-family: var(--mono); font-size: 11.5px; color: var(--text-muted); letter-spacing: 0.02em;
  }
  .attn-item .due {
    font-family: var(--mono); font-size: 12px; color: var(--text-muted); text-align: right; white-space: nowrap;
  }
  .attn-item .due.soon { color: var(--warning); }

  .cal-list { display: flex; flex-direction: column; gap: 10px; }
  .cal-item {
    display: flex; gap: 16px; align-items: baseline; font-family: var(--serif); font-size: 15.5px; padding: 2px 0;
  }
  .cal-item .time {
    font-family: var(--mono); font-size: 12.5px; color: var(--icarus); width: 62px; flex: none;
    font-variant-numeric: tabular-nums;
  }
  .cal-item .where { color: var(--text-faint); font-size: 13.5px; }

  .ticker {
    border-left: 1px solid var(--hairline); padding-left: 26px;
    display: flex; flex-direction: column; gap: 26px;
  }
  .ticker-item .eyebrow { margin-bottom: 6px; }
  .ticker-item .val { font-family: var(--mono); font-size: 14px; color: var(--text); }
  .ticker-item .sub { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }

  /* ── ACTIVITY ──────────────────────────────────────────────────── */

  .activity-head {
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .activity-head h1 {
    font-family: var(--mono); font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase;
    margin: 0; display: flex; align-items: center; gap: 10px;
  }

  .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 8px var(--success); animation: pulse 2s ease-in-out infinite;
  }
  .live-dot.offline { background: var(--critical); box-shadow: 0 0 8px var(--critical); animation: none; }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--hairline);
    background: var(--surface); color: var(--text-muted); cursor: pointer;
  }
  .chip[data-active="true"] { color: var(--void); border-color: transparent; }
  .chip[data-actor="all"][data-active="true"] { background: var(--text); }
  .chip[data-actor="icarus"][data-active="true"] { background: var(--icarus); }
  .chip[data-actor="councilor"][data-active="true"] { background: var(--councilor); }
  .chip[data-actor="triage"][data-active="true"] { background: var(--triage); }
  .chip[data-actor="system"][data-active="true"] { background: var(--system); color: var(--text); }

  .search {
    font-family: var(--mono); font-size: 12px; background: var(--surface);
    border: 1px solid var(--hairline); color: var(--text); padding: 8px 12px;
    border-radius: var(--radius); width: 220px;
  }
  .search::placeholder { color: var(--text-faint); }

  .legend {
    display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px;
    color: var(--text-faint); margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--hairline-soft);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 8px; height: 8px; border-radius: 2px; }

  .timeline { display: flex; flex-direction: column; gap: 10px; }

  .thread {
    position: relative; display: flex; flex-direction: column; gap: 0;
    border: 1px solid var(--hairline-soft); border-radius: var(--radius);
    overflow: hidden; background: var(--surface);
    --thread-bg: var(--surface);
  }

  .thread-label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-faint); padding: 8px 16px 0;
  }

  .row {
    position: relative; display: grid; grid-template-columns: 100px 16px 78px 1fr;
    gap: 14px; align-items: start; padding: 10px 16px 10px 16px; font-family: var(--mono); font-size: 13px;
  }
  .row + .row { border-top: 1px solid var(--hairline-soft); }

  .row .ts { color: var(--text-faint); font-variant-numeric: tabular-nums; padding-top: 1px; }

  .lane { position: relative; display: flex; justify-content: center; }
  .lane::before {
    content: ""; position: absolute; top: -10px; bottom: -10px; width: 2px; background: var(--hairline-soft);
  }
  .thread .row:first-child .lane::before { top: 50%; }
  .thread .row:last-child .lane::before { bottom: 50%; }
  .lane .node {
    position: relative; width: 9px; height: 9px; border-radius: 50%;
    margin-top: 4px; z-index: 1; border: 2px solid var(--surface);
  }

  .row[data-actor="icarus"] .node { background: var(--icarus); }
  .row[data-actor="councilor"] .node { background: var(--councilor); }
  .row[data-actor="triage"] .node { background: var(--triage); }
  .row[data-actor="system"] .node { background: var(--system); }

  .tag {
    font-size: 10px; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 3px;
    height: fit-content; text-align: center; color: var(--void); font-weight: 600;
  }
  .row[data-actor="icarus"] .tag { background: var(--icarus); }
  .row[data-actor="councilor"] .tag { background: var(--councilor); }
  .row[data-actor="triage"] .tag { background: var(--triage); }
  .row[data-actor="system"] .tag { background: var(--system); color: var(--text); }

  .row .detail .action { color: var(--text); margin: 0 0 2px; }
  .row .detail .action.ok { color: var(--success); }
  .row .detail .action.warn { color: var(--warning); }
  .row .detail .action.crit { color: var(--critical); }
  .row .detail .sub { color: var(--text-muted); font-size: 12px; white-space: pre-wrap; }

  .thread.dim { border-style: dashed; background: transparent; --thread-bg: transparent; }
  .thread.dim .row { opacity: 0.6; }

  /* New-activity entrance: a row slides/fades in, and a brand-new thread
     gets a brief tint of its actor's color that settles back to the
     surface — same accent colors as the lane dots, just momentary. */
  @keyframes rowEnter {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row-enter { animation: rowEnter 0.35s ease-out; }

  @keyframes threadFlash {
    from { background-color: color-mix(in srgb, var(--flash, var(--icarus)) 22%, var(--thread-bg)); }
    to { background-color: var(--thread-bg); }
  }
  .thread-enter { animation: threadFlash 1.4s ease-out; }

  @media (prefers-reduced-motion: reduce) {
    .row-enter, .thread-enter { animation: none; }
  }
  .thread.dim .lane::before { background: transparent; }

  .row[hidden] { display: none; }
  .thread[data-empty="true"] { display: none; }

  @media (max-width: 860px) {
    .today-grid { grid-template-columns: 1fr; }
    .ticker { border-left: none; border-top: 1px solid var(--hairline); padding-left: 0; padding-top: 24px; flex-direction: row; flex-wrap: wrap; }
    .row { grid-template-columns: 78px 16px 1fr; }
    .row .tag { grid-column: 3; width: fit-content; margin-bottom: 4px; }
  }
  @media (max-width: 560px) { .shell { padding: 0 16px 60px; } }
</style>

<div class="shell">
  <header class="masthead">
    <div class="wordmark">
      <svg class="glyph tri" viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="12,4 21,19 3,19" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      </svg>
      <span class="name">ICARUS</span>
      <span class="host" id="host-label">/ —</span>
    </div>
    <div class="masthead-right">
      <span class="clock" id="clock">—</span>
      <span class="readiness-pill" id="readiness-pill"><span class="dot neutral"></span> No telemetry</span>
    </div>
    <nav class="tabs">
      <button class="active" data-view="today">Today</button>
      <button data-view="activity">Activity</button>
    </nav>
  </header>

  <!-- ───────────────────────── TODAY ───────────────────────── -->
  <main class="view active" id="view-today">
    <div class="today-grid">
      <div class="dispatch">
        <p class="eyebrow" id="dispatch-date">—</p>
        <h1 id="dispatch-headline"><svg class="loader tri" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,4 21,19 3,19" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /></svg> Loading today's brief…</h1>
        <p class="lede" id="dispatch-lede"></p>
        <p class="byline">Filed by Icarus · L1 · <span id="byline-model">qwen3.6</span></p>

        <section class="block">
          <p class="eyebrow" id="attention-count">Needs your attention</p>
          <div class="attn-list" id="attention-list"></div>
        </section>

        <section class="block">
          <p class="eyebrow">Upcoming calendar</p>
          <div class="cal-list" id="calendar-list"></div>
        </section>
      </div>

      <aside class="ticker" id="ticker"></aside>
    </div>
  </main>

  <!-- ─────────────────────── ACTIVITY ─────────────────────── -->
  <main class="view" id="view-activity">
    <div class="activity-head">
      <h1><span class="live-dot" id="live-dot"></span> Activity — <span id="live-label">connecting…</span></h1>
      <div class="filters">
        <input class="search" id="search" placeholder="search activity…" />
        <button class="chip" data-actor="all" data-active="true">All</button>
        <button class="chip" data-actor="icarus">Icarus</button>
        <button class="chip" data-actor="councilor">Councilor</button>
        <button class="chip" data-actor="triage">Triage</button>
        <button class="chip" data-actor="system">System</button>
      </div>
    </div>

    <div class="legend">
      <span><i class="sw" style="background:var(--icarus)"></i>Icarus · L1</span>
      <span><i class="sw" style="background:var(--councilor)"></i>Councilor · L2</span>
      <span><i class="sw" style="background:var(--triage)"></i>Email triage</span>
      <span><i class="sw" style="background:var(--system)"></i>System / watchers</span>
      <span>Bracketed rows = one correlated thread</span>
    </div>

    <div class="timeline" id="timeline">
      <p class="empty-note" id="timeline-empty"><svg class="loader tri" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,4 21,19 3,19" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /></svg> Loading activity…</p>
    </div>
  </main>
</div>

<script>
  const ACTOR_TAGS = { icarus: "ICR", councilor: "CNC", triage: "TRG", system: "SYS" };

  // ── Tabs ──────────────────────────────────────────────────────────
  document.querySelectorAll('nav.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('main.view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
    });
  });

  // ── Clock ─────────────────────────────────────────────────────────
  function tick() {
    document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 8);
  }
  tick();
  setInterval(tick, 1000);

  function dispatchLabel(date) {
    const h = date.getHours();
    if (h >= 5 && h < 12) return 'Morning Dispatch';
    if (h >= 12 && h < 17) return 'Afternoon Dispatch';
    if (h >= 17 && h < 21) return 'Evening Dispatch';
    return 'Night Dispatch';
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    try { return new Date(iso).toLocaleTimeString([], { hour12: false }); }
    catch { return iso; }
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ── Today ─────────────────────────────────────────────────────────
  // TEMP: artificial delay so the loader is actually visible on a fast
  // local network — everything normally resolves in well under 100ms.
  // Remove once you've seen it.
  const DEBUG_LOAD_DELAY_MS = 1500;
  const _debugDelay = () => new Promise(r => setTimeout(r, DEBUG_LOAD_DELAY_MS));

  async function loadToday() {
    let data;
    try {
      const resp = await fetch('/api/today');
      await _debugDelay();
      data = await resp.json();
    } catch (e) {
      document.getElementById('dispatch-headline').textContent = "Couldn't reach Icarus.";
      document.getElementById('dispatch-lede').textContent = String(e);
      return;
    }

    const now = new Date(data.date);
    document.getElementById('dispatch-date').textContent =
      now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }) + ' · ' + dispatchLabel(now);
    document.getElementById('host-label').textContent = '/ ' + (data.hostname || 'unknown-host');

    const attnCount = data.attention.length;
    const calCount = data.calendar.length;
    document.getElementById('dispatch-headline').textContent =
      attnCount === 0 ? "Nothing needs you right now." : `${attnCount} thing${attnCount === 1 ? '' : 's'} need${attnCount === 1 ? 's' : ''} you today.`;

    const councilorNote = data.ticker.councilor
      ? `The Councilor last ${data.ticker.councilor.action} at ${fmtTime(data.ticker.councilor.created_at)}.`
      : "No Councilor activity recorded yet.";
    document.getElementById('dispatch-lede').innerHTML =
      `${attnCount} item${attnCount === 1 ? '' : 's'} tracked for attention, <span class="hl">${calCount}</span> upcoming ` +
      `calendar event${calCount === 1 ? '' : 's'} synced. ${escapeHtml(councilorNote)}`;

    document.getElementById('byline-model').textContent = data.ticker.model?.name || "local model";
    document.getElementById('attention-count').textContent = `Needs your attention · ${attnCount}`;

    renderAttention(data.attention);
    renderCalendar(data.calendar);
    renderTicker(data.ticker);
    renderReadiness(data.ticker.telemetry);
  }

  function renderAttention(items) {
    const el = document.getElementById('attention-list');
    if (items.length === 0) {
      el.outerHTML = '<div class="empty-note" id="attention-list">Nothing outstanding.</div>';
      return;
    }
    el.innerHTML = items.map(i => {
      const stripe = i.item_type === 'bill' ? 'bill' : (i.item_type === 'job_application' ? 'job_application' : 'default');
      const title = i.summary || i.entity_key;
      const meta = `${i.item_type.replace('_', ' ')} · ${i.state}${i.source ? ' · via ' + i.source : ''}`;
      const due = i.due_at ? fmtDate(i.due_at) : 'no due date';
      return `<div class="attn-item">
        <div class="stripe ${stripe}"></div>
        <div class="body"><p class="title">${escapeHtml(title)}</p><p class="meta">${escapeHtml(meta)}</p></div>
        <div class="due">${escapeHtml(due)}</div>
      </div>`;
    }).join('');
  }

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' }); }
    catch { return iso; }
  }

  function renderCalendar(items) {
    const el = document.getElementById('calendar-list');
    if (items.length === 0) {
      el.outerHTML = '<div class="empty-note" id="calendar-list">No events synced yet.</div>';
      return;
    }
    el.innerHTML = items.slice(0, 8).map(i => {
      const when = i.due_at
        ? new Date(i.due_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        : '—';
      const where = i.payload?.location ? `· ${i.payload.location}` : '';
      return `<div class="cal-item"><span class="time">${escapeHtml(when)}</span> ${escapeHtml(i.summary || i.entity_key)} <span class="where">${escapeHtml(where)}</span></div>`;
    }).join('');
  }

  function renderTicker(ticker) {
    const el = document.getElementById('ticker');
    const councilor = ticker.councilor;
    const triage = ticker.triage;
    const t = ticker.telemetry;

    el.innerHTML = `
      <div class="ticker-item">
        <p class="eyebrow">Councilor</p>
        <p class="val">${councilor ? escapeHtml(councilor.action) : 'no activity yet'}</p>
        <p class="sub">${councilor ? 'last ' + fmtTime(councilor.created_at) : ''}</p>
      </div>
      <div class="ticker-item">
        <p class="eyebrow">Email triage</p>
        <p class="val">${triage ? escapeHtml(triage.action) : 'no activity yet'}</p>
        <p class="sub">${triage ? 'last ' + fmtTime(triage.created_at) : ''}</p>
      </div>
      <div class="ticker-item">
        <p class="eyebrow">Heartbeat</p>
        <p class="val">every ${ticker.heartbeat_interval_seconds}s</p>
      </div>
      <div class="ticker-item">
        <p class="eyebrow">Local model</p>
        <p class="val">${escapeHtml(ticker.model?.name || '—')}</p>
        <p class="sub">${escapeHtml(ticker.model?.url || '')}</p>
      </div>
      ${t ? `
      <div class="ticker-item">
        <p class="eyebrow">System</p>
        <p class="val">cpu ${t.cpu_percent ?? '—'}% · gpu ${t.gpu_util_percent ?? '—'}%</p>
        <p class="sub">mem ${t.memory_used_mb ?? '—'}/${t.memory_total_mb ?? '—'} MB</p>
      </div>` : ''}
    `;
  }

  function renderReadiness(t) {
    const pill = document.getElementById('readiness-pill');
    if (!t || !t.simulation_readiness) {
      pill.innerHTML = '<span class="dot neutral"></span> No telemetry';
      return;
    }
    const r = t.simulation_readiness.toLowerCase();
    const cls = r === 'green' ? 'success' : (r === 'yellow' ? 'warning' : 'critical');
    const label = r === 'green' ? 'Nominal' : (r === 'yellow' ? 'Elevated' : 'Critical');
    pill.innerHTML = `<span class="dot ${cls}"></span> ${label}`;
  }

  // ── Activity ──────────────────────────────────────────────────────
  // threadOrder: most-recently-updated thread first. Each thread is a DOM
  // node keyed by thread_id (or a synthetic per-event key for standalone
  // events with no thread_id, which render as single dashed rows).
  const timelineEl = document.getElementById('timeline');
  const emptyNote = document.getElementById('timeline-empty');
  const threadEls = new Map(); // key -> element
  let syntheticSeq = 0;

  function actorLabel(actor) { return ACTOR_TAGS[actor] || actor.slice(0, 3).toUpperCase(); }

  const ACTOR_FLASH = {
    icarus: 'var(--icarus)', councilor: 'var(--councilor)',
    triage: 'var(--triage)', system: 'var(--system)',
  };

  function rowHtml(ev, live) {
    const actionClass = ev.severity === 'critical' ? 'crit' : (ev.severity === 'warning' ? 'warn' :
      (['responded', 'delivered', 'tracked', 'notified', 'spam_trashed'].includes(ev.event_type) ? 'ok' : ''));
    return `<div class="row${live ? ' row-enter' : ''}" data-actor="${ev.actor}">
      <span class="ts">${fmtTime(ev.created_at)}</span>
      <span class="lane"><span class="node"></span></span>
      <span class="tag">${actorLabel(ev.actor)}</span>
      <div class="detail">
        <p class="action ${actionClass}">${escapeHtml(ev.action)}</p>
        ${ev.detail ? `<p class="sub">${escapeHtml(ev.detail.length > 400 ? ev.detail.slice(0, 400) + '…' : ev.detail)}</p>` : ''}
      </div>
    </div>`;
  }

  function threadLabelFor(threadId) {
    if (!threadId) return null;
    if (threadId.startsWith('esc-')) return 'Escalation';
    if (threadId.startsWith('consult-')) return 'Consultation';
    if (threadId.startsWith('triage-')) return 'Email triage';
    if (threadId.startsWith('spam-')) return 'Spam review';
    return null;
  }

  function upsertThread(ev, live = true) {
    emptyNote.remove?.();
    const key = ev.thread_id || `__standalone-${syntheticSeq++}`;
    let el = threadEls.get(key);

    if (el) {
      // Append the new row to the existing thread, then move the whole
      // thread card to the top — most-recently-active thread leads.
      const rowsWrap = el;
      rowsWrap.insertAdjacentHTML('beforeend', rowHtml(ev, live));
      timelineEl.prepend(rowsWrap);
    } else {
      const isStandalone = !ev.thread_id;
      const label = threadLabelFor(ev.thread_id);
      const wrap = document.createElement('div');
      wrap.className = 'thread' + (isStandalone ? ' dim' : '') + (live ? ' thread-enter' : '');
      wrap.dataset.key = key;
      wrap.style.setProperty('--flash', ACTOR_FLASH[ev.actor] || 'var(--icarus)');
      wrap.innerHTML = (label ? `<p class="thread-label">${label}</p>` : '') + rowHtml(ev, live);
      timelineEl.prepend(wrap);
      threadEls.set(key, wrap);
    }
    applyFilters();
  }

  function loadActivityBackfill() {
    return fetch('/api/activity/recent?limit=150')
      .then(r => r.json())
      .then(data => _debugDelay().then(() => data))
      .then(data => {
        // Backfill arrives oldest-first; feed in order so thread ordering
        // (most-recent-first) comes out the same as the live path would.
        // live=false — this is history, not new activity, so it renders in
        // place without the pop-in animation reserved for the live feed.
        for (const ev of data.events) upsertThread(ev, false);
        if (data.events.length === 0) {
          const note = document.getElementById('timeline-empty');
          if (note) note.innerHTML = "No activity yet — it'll appear here as Icarus, the Councilor, and email triage do things.";
        }
      })
      .catch(() => {
        const note = document.getElementById('timeline-empty');
        if (note) note.innerHTML = "Couldn't reach Icarus.";
      });
  }

  function connectActivityWs() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws/activity`);
    const liveDot = document.getElementById('live-dot');
    const liveLabel = document.getElementById('live-label');

    ws.onopen = () => { liveDot.classList.remove('offline'); liveLabel.textContent = 'live'; };
    ws.onclose = () => {
      liveDot.classList.add('offline'); liveLabel.textContent = 'reconnecting…';
      setTimeout(connectActivityWs, 3000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (msg) => {
      try { upsertThread(JSON.parse(msg.data)); } catch {}
    };
  }

  // ── Filters ───────────────────────────────────────────────────────
  const chips = document.querySelectorAll('.chip');
  let activeActor = 'all';
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      activeActor = chip.dataset.actor;
      chips.forEach(c => c.dataset.active = (c === chip) ? 'true' : 'false');
      applyFilters();
    });
  });
  document.getElementById('search').addEventListener('input', applyFilters);

  function applyFilters() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    document.querySelectorAll('.thread').forEach(thread => {
      let visible = 0;
      thread.querySelectorAll('.row').forEach(row => {
        const matchesActor = activeActor === 'all' || row.dataset.actor === activeActor;
        const matchesText = !q || row.textContent.toLowerCase().includes(q);
        const show = matchesActor && matchesText;
        row.hidden = !show;
        if (show) visible++;
      });
      thread.dataset.empty = visible === 0 ? 'true' : 'false';
    });
  }

  // ── Boot ──────────────────────────────────────────────────────────
  loadToday();
  loadActivityBackfill().then(connectActivityWs);
</script>
