version: "3.8"

services:
  icarus-brain:
    image: vllm/vllm-openai:latest
    container_name: icarus-brain
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    env_file: .env
    entrypoint: [ "vllm", "serve" ]
    command: >-
      /models/gemma-3-12b-it-q4_0.gguf --max-model-len 4096 --gpu-memory-utilization 0.9 --enable-auto-tool-choice --tool-call-parser pythonic --host 0.0.0.0
    ports:
      - "8000:8000"
    networks:
      - icarus-net
    volumes:
      - ./vllm_cache:/root/.cache/huggingface
      - ./models:/models

  icarus-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icarus-api
    env_file: .env
    ports:
      - "8080:8000"
    networks:
      - icarus-net
    volumes:
      - ./backend:/app/backend:ro # Read-only source code mount for L1 restriction
      - ./workspace/ipc:/workspace/ipc
      - ./workspace/memory:/workspace/memory
      - ./workspace/projects:/workspace/projects
    depends_on:
      - icarus-brain

networks:
  icarus-net:
    driver: bridge
