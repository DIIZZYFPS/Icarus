version: "3.8"

services:
  icarus-brain:
    image: ollama/ollama
    container_name: icarus-brain
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    env_file: .env
    environment:
      - OLLAMA_HOST=0.0.0.0
    entrypoint: [ "/bin/bash", "/entrypoint.sh" ]
    ports:
      - "8000:11434"
    networks:
      - icarus-net
    volumes:
      - ./ollama_data:/root/.ollama
      - ./ollama_entrypoint.sh:/entrypoint.sh:ro
      - ./Modelfile:/Modelfile:ro

  icarus-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icarus-api
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    ports:
      - "8080:8000"
    networks:
      - icarus-net
    volumes:
      - ./backend:/app/backend:ro # Read-only source code mount for L1 restriction
      - ./workspace/memory:/workspace/memory
      - ./workspace/projects:/workspace/projects
    depends_on:
      - icarus-brain
      - redis

  redis:
    image: redis:7-alpine
    container_name: icarus-redis
    networks:
      - icarus-net
    ports:
      - "6379:6379"

  email_triage:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: icarus-worker # Shared image with api
    command: python -m backend.agent.worker_email_triage
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GMAIL_PUBSUB_TOPIC=${GMAIL_PUBSUB_TOPIC}
      - GMAIL_PUBSUB_SUBSCRIPTION=${GMAIL_PUBSUB_SUBSCRIPTION}
    networks:
      - icarus-net
    volumes:
      - ./backend:/app/backend:ro # Read-only source code mount for L1 restriction
      - ./workspace/memory:/workspace/memory
      - ./workspace/projects:/workspace/projects
    depends_on:
      - redis
      - icarus-brain
    deploy:
      replicas: 0 # Scaled dynamically by orchestrator

networks:
  icarus-net:
    driver: bridge
