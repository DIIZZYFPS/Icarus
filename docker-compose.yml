services:
  icarus-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icarus-api
    restart: unless-stopped
    # Host networking: container-to-host traffic across the icarus-net bridge
    # was being dropped by a host firewall rule we couldn't inspect/fix
    # without root (confirmed: DNS resolved fine, every host port was
    # unreachable via the bridge gateway regardless of which one). Host mode
    # shares the host's network namespace directly, so 127.0.0.1 just works —
    # no bridge crossing, no host.docker.internal/extra_hosts trick needed.
    # Filesystem/process containment (:ro mount, no shell tools) is unaffected;
    # this only gives up network-namespace isolation for icarus-api.
    network_mode: host
    env_file: .env
    environment:
      - REDIS_URL=redis://127.0.0.1:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # L1 chat, consultation, scoring, and escalation all route here — the
      # bare-host llama-server (Qwen3.6-35B), not the Google cloud API and
      # not a dedicated dockerized model anymore (icarus-brain retired).
      - LOCAL_LLM_URL=http://127.0.0.1:8080/v1
    volumes:
      - ./backend:/app/backend:ro # Read-only source code mount for L1 restriction
      - ./workspace/memory:/workspace/memory
      - ./workspace/projects:/workspace/projects
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: icarus-redis
    restart: unless-stopped
    networks:
      - icarus-net
    ports:
      - "6379:6379"

  email_triage:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: icarus-worker # Shared image with api
    command: python -m backend.agent.worker_email_triage
    restart: unless-stopped
    network_mode: host # see icarus-api — same bridge-to-host firewall issue
    env_file: .env
    environment:
      - REDIS_URL=redis://127.0.0.1:6379/0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GMAIL_PUBSUB_TOPIC=${GMAIL_PUBSUB_TOPIC}
      - GMAIL_PUBSUB_SUBSCRIPTION=${GMAIL_PUBSUB_SUBSCRIPTION}
      # Email classification routes here now, not Gemma cloud — this was the
      # unconditional, per-email privacy leak; see LOCAL_LLM_URL on icarus-api.
      - LOCAL_LLM_URL=http://127.0.0.1:8080/v1
    volumes:
      - ./backend:/app/backend:ro # Read-only source code mount for L1 restriction
      - ./workspace/memory:/workspace/memory
      - ./workspace/projects:/workspace/projects
    depends_on:
      - redis

  job_scout:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: icarus-worker # Shared image with api / email_triage
    command: python -m backend.agent.worker_job_scout
    restart: unless-stopped
    network_mode: host # see icarus-api — same bridge-to-host firewall issue
    env_file: .env
    environment:
      - REDIS_URL=redis://127.0.0.1:6379/0
      # Job-match scoring routes here, same as everything else — see
      # LOCAL_LLM_URL on icarus-api.
      - LOCAL_LLM_URL=http://127.0.0.1:8080/v1
    volumes:
      - ./backend:/app/backend:ro # Read-only source code mount for L1 restriction
      - ./workspace/memory:/workspace/memory
      # project_corpus.py's flagship-project resume fallback reads
      # resume.md from here; GITHUB_TOKEN (for the corpus's actual GitHub
      # reads) arrives via env_file above, no explicit line needed.
      - ./workspace/projects:/workspace/projects
    depends_on:
      - redis

networks:
  icarus-net:
    driver: bridge
